<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Batch Assist</title>
<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#e0f2fe,#f8fafc);}
h1{text-align:center;padding:18px;color:#fff;background:linear-gradient(90deg,#2563eb,#06b6d4);margin:0;font-weight:900;}
.container{padding:16px}
.card{background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 25px rgba(0,0,0,0.08);}
.card.cow{border-left:6px solid #7c3aed;}
.card.cow h3{color:#7c3aed;}
h3{margin-bottom:14px;font-weight:900;}
.row{display:flex;gap:12px;margin-top:10px;}
.col{flex:1;min-width:0;}
.col.big{flex:4;}
.col.small{flex:3;}
.field{position:relative;margin-top:14px;}
.field input{width:100%;padding:14px;border-radius:12px;border:2px solid #cbd5f5;box-sizing:border-box;font-size:24px;font-weight:800;color:#111827;}
.field input:focus{border-color:#2563eb;box-shadow:0 0 8px rgba(37,99,235,0.3);}
.field label{position:absolute;top:-8px;left:10px;background:#fff;padding:2px 6px;font-size:12px;font-weight:800;color:#1e40af;border-radius:6px;}
button{width:100%;padding:16px;border:none;border-radius:16px;margin-top:12px;background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff;font-weight:900;}
.toggle{background:#2563eb;display:none;}
table{width:100%;margin-top:14px;border-collapse:collapse;display:none;background:#fff;border-radius:12px;}
th,td{padding:12px;text-align:center;}
th{background:#3b82f6;color:white;}
.total{background:#fde68a;font-weight:900;}
.calc{display:none;margin-top:14px;}
.calc-card{margin-bottom:16px;padding:16px;border-radius:16px;background:#ffffff;box-shadow:0 6px 18px rgba(0,0,0,0.1);}
.panel{margin-top:10px;padding:12px;border-radius:12px;}
.fat{background:#fff7ed;border-left:5px solid #f97316;}
.snf{background:#eff6ff;border-left:5px solid #2563eb;}
.step{margin-bottom:6px;font-size:14px;}

/* Keep validation warnings neatly below their own input.
   The text wraps inside the field instead of overflowing into adjacent fields. */
.component-warning{
  display:none;
  position:static !important;
  float:none !important;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  margin:6px 0 0;
  padding:0 2px;
  color:#b45309;
  font-size:12px;
  font-weight:700;
  line-height:1.25;
  white-space:normal !important;
  overflow-wrap:anywhere;
  word-break:break-word;
  flex:none;
}
.row .col{
  min-width:0;
  overflow:visible;
}
.field{
  min-width:0;
  width:100%;
}
summary{list-style:none;cursor:pointer;font-size:18px;font-weight:800;padding:6px 0;display:flex;align-items:center;gap:8px;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"▶";display:inline-block;transition:transform .25s ease;font-size:14px;}
details[open] > summary::before{transform:rotate(90deg);}
.card.cow summary{color:#7c3aed;}
.mode-row{display:flex;align-items:center;gap:14px;}
.mode-label{font-weight:700;min-width:64px;}
.settings-btn{
margin-left:auto;
width:32px;
height:32px;
padding:0;
border:none;
background:transparent;
box-shadow:none;
color:#1d4ed8;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
line-height:1;
cursor:pointer;
transform:translateY(-4px);
transition:transform .25s ease,color .25s ease;
}
.settings-btn:hover{
transform:translateY(-4px) rotate(90deg);
color:#2563eb;
}


@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-18px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}


.mode-select{
width:100%;
padding:14px;
border:2px solid #cbd5f5;
border-radius:12px;
font-size:20px;
font-weight:700;
background:#fff;
color:#111827;
box-sizing:border-box;
}
.mode-select:focus{
border-color:#2563eb;
outline:none;
box-shadow:0 0 8px rgba(37,99,235,.3);
}
.static-label{
display:block;
font-size:14px;
font-weight:800;
color:#1e40af;
margin-bottom:8px;
}


.card.batchprep{border:none;border-left:8px solid #000;border-radius:18px;}
.card.batchprep h3{color:#5b3a00;font-weight:900;}


#settingsMenu{
display:flex;
align-items:center;
justify-content:center;
backdrop-filter:blur(14px);
}
#settingsMenu .menu-box{
    width:min(380px,88vw);
    background:#ffffff;
    border-radius:30px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.22);
    animation:pop .25s ease;
    max-height:85vh;
    overflow-y:auto;
    box-sizing:border-box;
}
.settings-title{
text-align:center;
font-size:38px;
font-weight:900;
margin:0 0 22px;
color:#111827;
}
.settings-option{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
padding:18px 22px;
margin:14px 0;
border:2px solid #e5e7eb;
border-left:8px solid transparent;
border-radius:18px;
background:#fff;
color:#111827;
font-size:20px;
font-weight:800;
box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.settings-option::after{
content:"›";
font-size:28px;
font-weight:900;
color:#9ca3af;
}
.settings-option.constants{border-left-color:#2563eb;}
.settings-option.variants{border-left-color:#22c55e;}
.settings-close{
display:block;
width:130px;
margin:20px auto 0;
padding:12px;
border:none;
border-radius:999px;
background:#6b7280;
color:#fff;
font-size:20px;
font-weight:800;
}



#variantsSection h3{text-align:center;font-size:22px;margin:0 0 16px;}
#variantList .card h3,#variantList h3{font-size:18px !important;text-align:center;}


.app-header{
margin:12px 16px 10px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
background:#F8FBFF;
border:2px solid #C62828 !important;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.05);
overflow:hidden;
}

.brand{
display:flex;
align-items:center;
width:100%;
padding:0 18px;
}
.brand img{
width:46px;
height:46px;
flex:0 0 auto;
}
.brand span{
flex:1;
text-align:center;
font-size:20px;
font-weight:700;
color:#163B84;
letter-spacing:.2px;
margin-left:18px;
margin-right:20px;
}


/* Fit longer quantity values in narrower three-column fields */
.row .col[style*="flex:4"] .field input{
  font-size:22px;
  font-weight:700;
}

/* Fit 3-decimal milk-component values in the narrower Leak and RCM Fat/SNF fields */
.row .col[style*="flex:3"] input[id="leakFat"],
.row .col[style*="flex:3"] input[id="leakSnf"],
.row .col[style*="flex:3"] input[id="rcmFat"],
.row .col[style*="flex:3"] input[id="rcmSnf"]{
  font-size:22px;
  font-weight:700;
}
</style>
<style>
.constants-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid #e5e7eb;
gap:16px;
}
.constants-row:last-child{border-bottom:none;}
.constants-label{
font-size:18px;
font-weight:700;
color:#1e3a8a;
flex:1;
}
.constants-value{
width:90px;
height:42px;
border:2px solid #c7d2fe;
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:800;
color:#111827;
background:#fff;
}

</style>
<style>

.constants-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid #e5e7eb;
}

.constants-label{
font-size:18px;
font-weight:700;
color:#1e3a8a;
flex:1;
}

.constants-value{
width:90px;
height:42px;
border:2px solid #c7d2fe;
border-radius:12px;
font-size:22px;
font-weight:800;
text-align:center;
background:#fff;
color:#111827;
}
</style>
</head>

<script>
/* =========================================================

   Version 2.0

========================================================= */

/* ---------- DOM Shortcuts ---------- */
const $ = id => document.getElementById(id);
const num = id => parseFloat($(id)?.value) || 0;
const T = $("batchQty");
const W = $("water");
const S = $("skim");
const C = $("cream");
const LQ = $("leak");
const R = $("rcm");

const F = $("rcmFat");
const SNF = $("rcmSnf");
const LF = $("leakFat");
const LS = $("leakSnf");
const WBAGS = $("wmp");
const GT={value:''},GC={value:''},GF={value:''},GS={value:''},GCF={value:''},GCS={value:''};
const TT={value:''},TC={value:''},TF={value:''},TS={value:''};

/* ===================================================
   MILK VARIANT DATABASE
=================================================== */

const VARIANTS = {

    cow: {
        id: "cow",
        name: "Cow Milk",
        fat: 3.5,
        snf: 8.5,
        density: 1.029
    },

    gold: {
        id: "gold",
        name: "Gold",
        fat: 4.5,
        snf: 9.0,
        density: 1.031
    },

    tmate: {
        id: "tmate",
        name: "TMate",
        fat: 5.5,
        snf: 10.0,
        density: 1.034
    },

    fcm: {
        id: "fcm",
        name: "FCM",
        fat: 6.0,
        snf: 9.0,
        density: 1.0298
    }

};
  function getVariant(id){
    return VARIANTS[id];
}

function getVariantList(){
    return Object.values(VARIANTS);
}
    function saveVariants(){
    localStorage.setItem("milkVariants", JSON.stringify(VARIANTS));
}

function loadVariants(){

    const saved = localStorage.getItem("milkVariants");

    if(!saved) return;

    try{

        const data = JSON.parse(saved);

        Object.keys(data).forEach(k=>{
            VARIANTS[k]=data[k];
        });

    }catch(e){}

}

// Settings defaults
const DEFAULT_SETTINGS={
  skimSNF:9.0,
  smpSNF:96.5,
  wmpFat:26.0,
  wmpSNF:70.5
};
function getSetting(key){
  const v=localStorage.getItem(key);
  return (v===null||v==="")?DEFAULT_SETTINGS[key]:parseFloat(v);
}
const skimSNF=getSetting("skimSNF");
const smpSNF=getSetting("smpSNF");
const wmpFat=getSetting("wmpFat");
const wmpSNF=getSetting("wmpSNF");


function clean(n){let x=Math.round(n*10)/10;return (x%1===0)?x.toFixed(0):x.toFixed(1);}
const settings={
skimSNF:getSetting("skimSNF", 8.4),
smpSNF:(()=>{
 const v=parseFloat(localStorage.getItem('smpSNF'));
 return (!isFinite(v)||v<10)?96.5:v;
})(),
boFat:parseFloat(localStorage.getItem('boFat'))||82.5,
wmpFat:getSetting("wmpFat", 26),
wmpSNF:getSetting("wmpSNF", 70)
};


function integerOnlyQuantity(el){
  // Quantity fields are whole numbers only. Any decimal point is ignored.
  const cleaned = String(el.value || "").replace(/\D/g, "");
  el.value = cleaned;
}

function updateRaw(){
  const t=+(document.getElementById('batchQty')||document.getElementById('T'))?.value||0;
  const w=+(document.getElementById('water')||document.getElementById('W'))?.value||0;
  const s=+(document.getElementById('skim')||document.getElementById('S'))?.value||0;
  const c=+(document.getElementById('cream')||document.getElementById('GC'))?.value||0;
  const l=+(document.getElementById('leak')||document.getElementById('LQ'))?.value||0;
  const r=document.getElementById('rcm')||document.getElementById('R');
  if(r) document.getElementById('rcm').value=Math.max(0,t-w-s-c-l);
}

function toggle(){
const c=document.getElementById("calc");
const btn=document.getElementById("btn");
if(c.style.display==="block"){
 c.style.display="none";
 btn.innerText="View Calculation";
 return;
}
c.style.display="block";
btn.innerText="Hide Calculation";
setTimeout(()=>{
 const y=c.getBoundingClientRect().top+window.pageYOffset-10;
 window.scrollTo({top:y,behavior:"smooth"});
},30);
}

function density(f,s){
return 1+(4*(s-(0.2*f)-0.36))/1000;
}
function getDensity(mode, fat, snf){
    return (mode === "density")
        ? density(fat, snf)
        : 1;
}
  function getMass(volume, density){
    return volume * density;
}
function buildCard(type,name,t,r,f,snf,s,lq,lf,ls,fatPct,snfPct,mode){
let d = getDensity(mode, fatPct, snfPct);

let rawD = getDensity(mode, f, snf);

let tTxt=(mode==="density")?`(${t}×${d.toFixed(3)})`:`${t}`;
let rTxt=(mode==="density")?`(${r}×${rawD.toFixed(3)})`:`${r}`;

let t_mass=getMass(t,d);
let r_mass=getMass(r,rawD);

let fatAvail=(r_mass*f/100);
let snfAvail=(r_mass*snf/100);

let fatAvailTxt=`[ ${rTxt} × ${f}/100 ]`;
let snfAvailTxt=`[ ${rTxt} × ${snf}/100 ]`;

if(num("cream")>0){
    fatAvail += num("cream") * num("creamFat") / 100;
    snfAvail += num("cream") * num("creamSnf") / 100;

    fatAvailTxt += ` + [ ${num("cream")} × ${num("creamFat")}/100 ]`;
    snfAvailTxt += ` + [ ${num("cream")} × ${num("creamSnf")}/100 ]`;
}

if(lq){
    let leakD = getDensity(mode, lf, ls);
    let l_mass = getMass(lq, leakD);
    let lTxt = (mode==="density")
        ? `(${lq}×${leakD.toFixed(3)})`
        : `${lq}`;

    fatAvail += l_mass * lf / 100;
    snfAvail += l_mass * ls / 100;

    fatAvailTxt += ` + [ ${lTxt} × ${lf}/100 ]`;
    snfAvailTxt += ` + [ ${lTxt} × ${ls}/100 ]`;
}

if(s){
let sTxt=(mode==="density")?`(${s}×1.030)`:`${s}`;
snfAvail+=((mode==="density")?(s*1.03):s)*settings.skimSNF/100;
snfAvailTxt+=` + [ ${sTxt} × ${settings.skimSNF}/100 ]`;
}
let wkg = (type === 'cow') ? ((num("wmp")) * 25) : 0;
let wfat=settings.wmpFat;
let wsnf=settings.wmpSNF;
if(wkg){
 fatAvail+=wkg*wfat/100;
 snfAvail+=wkg*wsnf/100;
 fatAvailTxt+=` + [ ${wkg} × ${wfat}/100 ]`;
 snfAvailTxt+=` + [ ${wkg} × ${wsnf}/100 ]`;
}

let fatReq=t_mass*fatPct/100;
let fatReqTxt=`${tTxt} × ${fatPct}/100`;

let fatDef=fatReq-fatAvail;
let BO=fatDef/(settings.boFat/100);
let cans=BO / 40;

let snfReq=t_mass*snfPct/100;
let snfReqTxt=`${tTxt} × ${snfPct}/100`;

let snfDef=snfReq-snfAvail;
let SMP=snfDef/(settings.smpSNF/100);
let bags=SMP/25;

return `<div class="calc-card"><h3>${name}</h3>
<div class="panel fat">
<h4>FAT</h4>
<div class="step">Required: ${fatReqTxt} = ${clean(fatReq)} kg</div>
<div class="step">Available: ${fatAvailTxt} = ${clean(fatAvail)} kg</div>
<div class="step">Deficit: ${clean(fatDef)} kg</div>
<div class="step">B.Oil Required: ${clean(BO)} kg</div>
<div class="step">B.Oil: ${clean(cans)} Cans</div>
</div>
<div class="panel snf">
<h4>SNF</h4>
<div class="step">Required: ${snfReqTxt} = ${clean(snfReq)} kg</div>
<div class="step">Available: ${snfAvailTxt} = ${clean(snfAvail)} kg</div>
<div class="step">Deficit: ${clean(snfDef)} kg</div>
<div class="step">SMP Required: ${clean(SMP)} kg</div>
<div class="step">SMP: ${clean(bags)} Bags</div>
</div></div>`;
}

    delete VARIANTS[id];

    saveVariants();
    loadVariantDropdown();

    alert("Milk Variant Deleted");
}

function saveSettings(){
localStorage.setItem('skimSNF',SET_SKIM.value);
localStorage.setItem('smpSNF',SET_SMP.value);
localStorage.setItem('boFat',SET_BOFAT.value);
localStorage.setItem('wmpFat',SET_WFAT.value);
localStorage.setItem('wmpSNF',SET_WSNF.value);
settings.skimSNF=parseFloat(SET_SKIM.value)||8.4;
settings.smpSNF=(function(){
 let v=parseFloat(SET_SMP.value);
 if(!isFinite(v)||v<10) v=96.5;
 SET_SMP.value=v;
 localStorage.setItem('smpSNF',v);
 return v;
})();
settings.boFat=parseFloat(SET_BOFAT.value)||82.5;
settings.wmpFat=parseFloat(SET_WFAT.value)||26;
settings.wmpSNF=parseFloat(SET_WSNF.value)||70;
saveVariants();    
closeSettings();
alert('Settings saved');
}


function resetSettings(){
SET_SKIM.value=8.4;SET_SMP.value=96.5;SET_BOFAT.value=82.5;SET_WFAT.value=26;SET_WSNF.value=70;
saveSettings();
}
function exportSettings(){
const data={skimSNF:settings.skimSNF,smpSNF:settings.smpSNF,boFat:settings.boFat,wmpFat:settings.wmpFat,wmpSNF:settings.wmpSNF};
prompt('Copy Settings JSON',JSON.stringify(data));
}
function importSettings(){
let s=prompt('Paste Settings JSON');
if(!s)return;
try{
let d=JSON.parse(s);
SET_SKIM.value=d.skimSNF??8.4;
SET_SMP.value=d.smpSNF??96.5;
SET_BOFAT.value=d.boFat??82.5;
SET_WFAT.value=d.wmpFat??26;
SET_WSNF.value=d.wmpSNF??70;

}

<script>

/* Milk-component input guard.
   Two digits without a decimal are interpreted as one decimal place
   (e.g. 48 -> 4.8). Higher-than-usual values are NOT capped; they
   remain in the field and are used normally in calculations. */
function showMilkComponentWarning(el, type, lowerLimit, upperLimit){
  const parent=el.closest(".field")||el.parentNode;
  const id=el.id+"_usualWarning";
  let msg=document.getElementById(id);
  if(!msg){
    msg=document.createElement("div");
    msg.id=id;
    msg.className="component-warning";
    parent.appendChild(msg);
  }
  const n=parseFloat(el.value);
  const textValue=String(el.value||"");
  if(!Number.isFinite(n) || !/\d+\.\d/.test(textValue)){
    msg.textContent="";
    msg.style.display="none";
    return;
  }
  let text="";
  if(lowerLimit !== null && lowerLimit !== undefined && n<lowerLimit) text=`⚠ ${type} value is lower than usual. Please verify.`;
  else if(n>upperLimit) text=`⚠ ${type} value is higher than usual. Please verify.`;
  msg.textContent=text;
  msg.style.display=text ? "block" : "none";
  if(text){
    msg.style.position="static";
    msg.style.width="100%";
    msg.style.maxWidth="100%";
    msg.style.whiteSpace="normal";
  }
}

function normalizeMilkComponentValue(el){
  let v=String(el.value||"").replace(/[^0-9.]/g,"");
  const dot=v.indexOf(".");
  if(dot!==-1) v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,"");
  if(v===""||v==="."){el.value=v;return;}
  if(dot===-1 && v.length>=2) el.value=v[0]+"."+v.slice(1);
  else el.value=v;
}

function formatMilkComponent(el,type,lowerLimit,upperLimit){
  normalizeMilkComponentValue(el);
  showMilkComponentWarning(el,type,lowerLimit,upperLimit);
  if(typeof updateRaw==="function") updateRaw();
}

function finalizeMilkComponent(el,type,lowerLimit,upperLimit){
  normalizeMilkComponentValue(el);
  if(/^\d$/.test(String(el.value||""))) el.value=String(el.value)+".0";
  showMilkComponentWarning(el,type,lowerLimit,upperLimit);
}

function setupMilkComponentGuards(){
 const fields=[
   {id:"rcmFat",type:"Fat",lower:3.6,upper:4.3},
   {id:"rcmSnf",type:"SNF",lower:7.6,upper:8.3},
   {id:"leakFat",type:"Fat",lower:null,upper:4.5},
   {id:"leakSnf",type:"SNF",lower:null,upper:8.5}
 ];
 fields.forEach(({id,type,lower,upper})=>{
   const el=document.getElementById(id);
   if(!el||el.dataset.guardAttached) return;
   el.dataset.guardAttached="1";
   el.addEventListener("input",function(){formatMilkComponent(this,type,lower,upper);});
   el.addEventListener("blur",function(){finalizeMilkComponent(this,type,lower,upper);});
   showMilkComponentWarning(el,type,lower,upper);
 });
}
document.addEventListener("DOMContentLoaded",setupMilkComponentGuards);

document.addEventListener("DOMContentLoaded",()=>{
  const fields=[
    {id:"BC_BF",type:"Fat",lower:3.6,upper:4.3},
    {id:"BC_BS",type:"SNF",lower:7.6,upper:8.3},
    {id:"BC_RF",type:"Fat",lower:3.6,upper:4.3},
    {id:"BC_RS",type:"SNF",lower:7.6,upper:8.3}
  ];
  fields.forEach(({id,type,lower,upper})=>{
    const el=document.getElementById(id);
    if(!el||el.dataset.thresholdBlurAttached) return;
    el.dataset.thresholdBlurAttached="1";
    el.addEventListener("blur",function(){finalizeMilkComponent(this,type,lower,upper);});
  });
});
